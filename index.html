<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='lesson_studio_v1';
  const DEFAULT_STUDENTS=[
    {id:'s_aashraya',name:'Aashraya',color:'lavender',active:true},
    {id:'s_krisha',name:'Krisha',color:'peach',active:true},
    {id:'s_shreesha',name:'Shreesha',color:'mint',active:true}
  ];
  // Historical lessons transcribed from the latest supplied Notes screenshot.
  // The dates take precedence when handwritten weekday labels do not match.
  const EXAMPLE_LESSONS=[
    ['s_krisha','2026-10-03',true],['s_shreesha','2026-10-03',true],
    ['s_aashraya','2026-10-06',true],['s_aashraya','2026-10-06',true],['s_aashraya','2026-10-07',true],
    ['s_aashraya','2026-10-13',true],['s_aashraya','2026-10-15',true],['s_aashraya','2026-10-16',true],
    ['s_krisha','2026-10-18',true],['s_shreesha','2026-10-18',true]
  ].map((x,i)=>({id:'seed_'+(i<8?i+1:i+2),studentId:x[0],date:x[1],time:'',hours:1,completed:x[2],notes:''}));
  const SERIES_START='2026-10-19';
  const DEFAULT_RULES=[
    {id:'weekly_a_mon',studentId:'s_aashraya',weekday:0,time:'',hours:1,startDate:SERIES_START,active:true},
    {id:'weekly_a_tue',studentId:'s_aashraya',weekday:1,time:'',hours:1,startDate:SERIES_START,active:true},
    {id:'weekly_a_wed',studentId:'s_aashraya',weekday:2,time:'',hours:1,startDate:SERIES_START,active:true},
    {id:'weekly_a_fri',studentId:'s_aashraya',weekday:4,time:'',hours:1,startDate:SERIES_START,active:true},
    {id:'weekly_k_sat',studentId:'s_krisha',weekday:5,time:'',hours:1,startDate:SERIES_START,active:true},
    {id:'weekly_s_sun',studentId:'s_shreesha',weekday:6,time:'',hours:1,startDate:SERIES_START,active:true}
  ];
  const SCREENSHOT_EXCEPTIONS=[
    // These exceptions preserve the repeating rules for November onwards.
    ['weekly_a_mon','2026-10-19','2026-10-23','s_aashraya',true,false],
    ['weekly_a_tue','2026-10-20','2026-10-23','s_aashraya',true,false],
    ['weekly_a_wed','2026-10-21','2026-10-24','s_aashraya',false,false],
    ['weekly_a_fri','2026-10-23','2026-10-23','s_aashraya',false,true],
    ['weekly_k_sat','2026-10-24','2026-10-24','s_krisha',false,true],
    ['weekly_s_sun','2026-10-25','2026-10-25','s_shreesha',false,true],
    ['weekly_s_sun','2026-11-01','2026-10-31','s_shreesha',false,false]
  ].map(([ruleId,originalDate,date,studentId,completed,deleted])=>({id:'rec:'+ruleId+':'+originalDate,ruleId,originalDate,studentId,date,time:'',hours:1,completed,deleted,notes:''}));
  const SCREENSHOT_ADDITIONS=[
    {id:'snapshot_krisha_20261026',studentId:'s_krisha',date:'2026-10-26',time:'',hours:1,completed:true,notes:''},
    {id:'snapshot_shreesha_20261027',studentId:'s_shreesha',date:'2026-10-27',time:'',hours:1,completed:false,notes:''}
  ];
  function screenshotLessons(){return [...structuredClone(EXAMPLE_LESSONS),...structuredClone(SCREENSHOT_EXCEPTIONS),...structuredClone(SCREENSHOT_ADDITIONS)];}
  function defaults(){return {version:4,hourlyRate:30,students:structuredClone(DEFAULT_STUDENTS),lessons:screenshotLessons(),recurringRules:structuredClone(DEFAULT_RULES),weekMonthOverrides:{}};}
  function readStore(){try{let raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaults();let data=JSON.parse(raw);if(!data||!Array.isArray(data.students)||!Array.isArray(data.lessons))throw Error('Invalid data');return data;}catch(err){console.error('Unable to read saved data',err);return defaults();}}
  let db={version:4,hourlyRate:30,students:[],lessons:[],recurringRules:[],weekMonthOverrides:{}};
  // Upgrade data saved by earlier versions on this same website/domain without losing edits.
  function migrateData(){
    db.recurringRules ||= structuredClone(DEFAULT_RULES);
    db.lessons ||= [];
    if(Number(db.version)<3){
      // Imported Apple lessons become ordinary, editable, locally stored lessons.
      for(let l of db.lessons){delete l.calendarKey;delete l.calendarSource;}
      // Preserve any custom changes to the original seeded entries.
      const friday16=db.lessons.find(l=>l.id==='seed_8');
      if(friday16 && friday16.date==='2026-10-16'&&friday16.studentId==='s_aashraya')friday16.completed=true;
      const extra=db.lessons.find(l=>l.id==='seed_9');
      if(extra && extra.date==='2026-10-16'&&extra.studentId==='s_aashraya'&&extra.hours===1&&!extra.time&&!extra.notes){
        db.lessons=db.lessons.filter(l=>l!==extra);
      }
      const oldSeeds=[
        ['seed_12','weekly_a_mon','2026-10-19'],['seed_13','weekly_a_tue','2026-10-20'],
        ['seed_14','weekly_a_wed','2026-10-21'],['seed_15','weekly_a_fri','2026-10-23'],
        ['seed_16','weekly_k_sat','2026-10-24'],['seed_17','weekly_s_sun','2026-10-25']
      ];
      for(let [seedId,ruleId,originalDate] of oldSeeds){
        let l=db.lessons.find(x=>x.id===seedId);
        if(l){l.id='rec:'+ruleId+':'+originalDate;l.ruleId=ruleId;l.originalDate=originalDate;}
      }
      delete db.calendarUrl; delete db.lastCalendarSync;
    }
    if(Number(db.version)<4){
      // Upgrade an untouched v6 starter dataset to the supplied 26 October
      // screenshot. Never overwrite an edited calendar or personal entries.
      const originalIds=new Set(['seed_1','seed_2','seed_3','seed_4','seed_5','seed_6','seed_7','seed_8','seed_10','seed_11']);
      const octoberRecords=db.lessons.filter(l=>l.date?.startsWith('2026-10')||l.originalDate?.startsWith('2026-10'));
      const pristine=octoberRecords.length===10 && octoberRecords.every(l=>originalIds.has(l.id)) && originalIds.size===octoberRecords.length &&
        octoberRecords.every(l=>!l.ruleId&&!l.notes&&!l.time&&Number(l.hours)===1 && !l.deleted && !l.displayWeekStart) &&
        db.recurringRules.length===DEFAULT_RULES.length && db.recurringRules.every(r=>DEFAULT_RULES.some(x=>x.id===r.id&&x.weekday===r.weekday&&x.studentId===r.studentId));
      if(pristine){
        const screenshotIds=new Set(screenshotLessons().map(l=>l.id));
        db.lessons=db.lessons.filter(l=>!originalIds.has(l.id)&&!screenshotIds.has(l.id)).concat(screenshotLessons());
      }
    }
    db.version=4;
    
  }
  const today = new Date();today.setHours(0,0,0,0);
  let selectedMonth=new Date(today.getFullYear(),today.getMonth(),1);
  let page='overview',view='list',filter='all',studentFilter='all',search='',sortMode='smart',modalKind=null,toastTimer;
  const $=sel=>document.querySelector(sel);
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',minimumFractionDigits:0,maximumFractionDigits:Number(n)%1?2:0}).format(Number(n)||0);
  const decimal=n=>Number.isInteger(+n)?String(n):Number(n).toFixed(2).replace(/0$/,'');
  const dateAt=s=>new Date(s+'T12:00:00');
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays=(str,days)=>{let d=dateAt(str);d.setDate(d.getDate()+days);return iso(d)};
  const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const monthDate=(year,mon)=>new Date(year,mon,1);
  const monthTitle=d=>d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayMonth=s=>dateAt(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const weekday=s=>dateAt(s).toLocaleDateString('en-GB',{weekday:'short'});
  const hoursLabel=n=>`${decimal(n)} ${Number(n)===1?'hr':'hrs'}`;
  const rate=()=>Number(db.hourlyRate)||30;
  const studentById=id=>db.students.find(s=>s.id===id)||{id,name:'Former student',color:'slate',active:false};
  const studentPalette={lavender:['#f1edff','#7355b4'],peach:['#fff0e8','#c97953'],mint:['#e4f7f1','#349475'],blue:['#e8f0ff','#5275c7'],pink:['#ffeaf3','#b75a86'],sand:['#fff4dd','#aa8334'],slate:['#edf1f5','#708093']};
  const avatar=(student,cls='')=>{let colors=studentPalette[student.color]||studentPalette.slate;return `<span class="avatar ${cls}" style="background:${colors[0]};color:${colors[1]}">${esc(student.name.trim().charAt(0).toUpperCase()||'?')}</span>`;};
  // Weekly template generates occurrences on demand, even years into the future.
  // Only exceptions / marked complete instances are stored, so there is no fixed end date.
  const recurringId=(ruleId,date)=>'rec:'+ruleId+':'+date;
  function recurringForMonth(d){
    let start=iso(new Date(d.getFullYear(),d.getMonth(),1));
    let end=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
    let generated=[];
    for(let rule of db.recurringRules){
      if(rule.active===false||rule.endDate&&rule.endDate<start||rule.startDate>end)continue;
      let first=dateAt(start),offset=(Number(rule.weekday)-(first.getDay()+6)%7+7)%7;
      first.setDate(first.getDate()+offset);
      for(let cursor=first;iso(cursor)<=end;cursor.setDate(cursor.getDate()+7)){
        let date=iso(cursor),id=recurringId(rule.id,date);
        if(date<rule.startDate||rule.endDate&&date>rule.endDate)continue;
        // Individual edits, cancellation and completion take precedence over the rule.
        if(db.lessons.some(l=>l.id===id))continue;
        generated.push({id,ruleId:rule.id,originalDate:date,studentId:rule.studentId,date,time:rule.time||'',hours:Number(rule.hours),completed:false,notes:''});
      }
    }
    return generated;
  }
  const lessonsInMonth=d=>[...db.lessons.filter(l=>!l.deleted&&l.date.startsWith(monthKey(d))),...recurringForMonth(d)].sort(sortLessons);
  function lessonById(id){let date=id.slice(-10);return db.lessons.find(l=>l.id===id)|| (id.startsWith('rec:')?recurringForMonth(monthDate(Number(date.slice(0,4)),Number(date.slice(5,7))-1)).find(l=>l.id===id):null);}
  function saveOccurrence(l){let saved=db.lessons.find(x=>x.id===l.id);if(saved)Object.assign(saved,l);else db.lessons.push({...l});}
  const sortLessons=(a,b)=>a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||String(a.id).localeCompare(String(b.id));
  const totalHours=list=>list.reduce((a,l)=>a+Number(l.hours),0);
  function stats(list){const done=list.filter(l=>l.completed),remaining=list.filter(l=>!l.completed);return {count:list.length,done:done.length,pending:remaining.length,doneHours:totalHours(done),hours:totalHours(list),remainingHours:totalHours(remaining),earned:totalHours(done)*rate(),projected:totalHours(list)*rate()};}
  function persist(){render();queueSave();}
  function goto(p){page=p;document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===p));window.scrollTo({top:0,behavior:'smooth'});render();}
  function toast(msg){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast" role="status">${icon('check','small')}${esc(msg)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3300);}
  function topbar(){
    let meta={overview:['Overview','Your tutoring, beautifully organised.'],lessons:['Lessons','Every session, in one clear place.']}[page];
    return `<div class="topbar"><div><p class="eyebrow">YOUR TUTORING WORKSPACE</p><h1 class="page-title">${meta[0]}<span style="color:#3769ef">.</span></h1><p class="page-subtitle">${meta[1]}</p></div><div class="top-actions"><div class="month-picker"><button type="button" aria-label="Previous month" data-month="-1">${icon('left','small')}</button><strong>${esc(monthTitle(selectedMonth))}</strong><button type="button" aria-label="Next month" data-month="1">${icon('right','small')}</button></div><button class="btn icon-action" data-action="open-settings" title="Settings and weekly timetable" aria-label="Settings and weekly timetable">${icon('settings','small')}</button></div></div>`;
  }
  function metricsHtml(s){return `<div class="metric-grid"><div class="card metric"><div class="metric-top"><span class="metric-label">Earned this month</span><span class="metric-ico green">${icon('wallet')}</span></div><div class="metric-number">${money(s.earned)}</div><div class="metric-meta"><b>${hoursLabel(s.doneHours)}</b> of lessons completed</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Potential earnings</span><span class="metric-ico blue">${icon('target')}</span></div><div class="metric-number">${money(s.projected)}</div><div class="metric-meta">Completed + planned sessions</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Still to earn</span><span class="metric-ico">${icon('clock')}</span></div><div class="metric-number">${money(s.projected-s.earned)}</div><div class="metric-meta"><b>${s.pending}</b> lessons yet to complete</div></div><div class="card metric"><div class="metric-top"><span class="metric-label">Lessons completed</span><span class="metric-ico">${icon('check')}</span></div><div class="metric-number">${s.done}<span style="font-size:.58em;color:#a0a7b1;font-weight:550"> / ${s.count}</span></div><div class="metric-meta"><b>${s.hours?Math.round(s.doneHours/s.hours*100):0}%</b> of scheduled hours taught</div></div></div>`;}
  function trendMonths(count=6){return Array.from({length:count},(_,i)=>monthDate(selectedMonth.getFullYear(),selectedMonth.getMonth()-(count-1-i)));}
  function chartHtml(months){let max=Math.max(1,...months.map(m=>stats(lessonsInMonth(m)).projected));return `<div class="chart-wrap">${months.map(m=>{let s=stats(lessonsInMonth(m)),all=s.projected/max*100,earned=s.earned/max*100;return `<div class="chart-col ${monthKey(m)===monthKey(selectedMonth)?'current':''}" title="${esc(monthTitle(m))}: ${money(s.earned)} earned, ${money(s.projected)} potential"><div class="chart-bar-wrap"><div class="chart-future" style="height:${Math.max(0,all-earned)}%;${all>0&&all-earned>0?'min-height:2px':''}"></div><div class="chart-earned" style="height:${earned}%;${earned>0?'min-height:2px':''}"></div></div></div>`}).join('')}</div><div class="chart-labels">${months.map(m=>`<span>${esc(m.toLocaleDateString('en-GB',{month:'short'}))}</span>`).join('')}</div><div class="legend"><span><i></i> Earned</span><span><i class="pale"></i> Planned</span></div>`;}
  function studentsSummary(list){return db.students.filter(x=>x.active||list.some(l=>l.studentId===x.id)).map(s=>{let per=stats(list.filter(l=>l.studentId===s.id));return {...s,...per};}).sort((a,b)=>b.projected-a.projected);}
  function studentsPanel(list){let all=studentsSummary(list).filter(s=>s.active);let archived=studentsSummary(list).filter(s=>!s.active);return `<div class="card insight-card"><div class="panel-head"><div><div class="toolbar-title">Your students</div><p class="toolbar-sub">${esc(monthTitle(selectedMonth))} breakdown</p></div><button class="mini-add" data-action="add-student" title="Add student">${icon('plus','small')} Add</button></div><div style="margin-top:15px">${all.length?all.map(s=>`<div class="student-row">${avatar(s)}<div class="student-info"><div class="student-name">${esc(s.name)} <button class="student-edit" data-edit-student="${esc(s.id)}" aria-label="Edit ${esc(s.name)}">${icon('edit','tiny')}</button></div><div class="student-sub">${s.done} of ${s.count} lessons done</div></div><div class="student-money">${money(s.earned)}<span>${money(s.projected)} possible</span></div></div>`).join(''):`<div class="muted" style="padding:30px 0">No active students.</div>`}</div>${archived.length?`<details style="margin-top:16px"><summary>Former students · ${archived.length}</summary>${archived.map(s=>`<div class="student-row">${avatar(s)}<div class="student-info">${esc(s.name)}<div class="student-sub">${s.done} of ${s.count} lessons done</div></div><div class="student-money">${money(s.earned)}</div></div>`).join('')}</details>`:''}<div class="progress-line"><div style="width:${list.length?stats(list).doneHours/Math.max(1,stats(list).hours)*100:0}%"></div></div><div class="progress-text"><span>Monthly progress</span><span>${list.length?Math.round(stats(list).doneHours/Math.max(1,stats(list).hours)*100):0}% complete</span></div></div>`;}
  function weeklyBanner(){return `<div class="sync-banner"><div class="sync-logo">${icon('calendar')}</div><div class="sync-body"><strong>Your weekly timetable is ready</strong><span>${db.recurringRules.filter(activeRule).length} lessons in your weekly pattern, repeating automatically. Tick off or reschedule any session independently.</span></div><button class="btn sync-button" data-action="open-settings">Edit timetable ${icon('right','small')}</button></div>`;}

    let ruleEdit=e.target.closest('[data-edit-rule]');if(ruleEdit){openRule(ruleEdit.dataset.editRule);return;}
    let ruleDelete=e.target.closest('[data-delete-rule]');if(ruleDelete){let r=db.recurringRules.find(x=>x.id===ruleDelete.dataset.deleteRule);if(r&&confirm('Remove this repeating weekly pattern? Individually edited and completed lessons will remain.')){db.recurringRules=db.recurringRules.filter(x=>x.id!==r.id);closeModal();persist();openSettings();toast('Weekly pattern removed');}return;}
    let ar=e.target.closest('[data-archive-student]');if(ar){let s=studentById(ar.dataset.archiveStudent);if(archiveConfirm(s)){persist();openSettings();toast('Student archived');}return;}
    let sed=e.target.closest('[data-edit-student]');if(sed){openStudent(sed.dataset.editStudent);return;}
    let addDate=e.target.closest('[data-add-date]');if(addDate){openLesson(null,addDate.dataset.addDate);return;}
    let del=e.target.closest('[data-delete-lesson]');if(del){let l=lessonById(del.dataset.deleteLesson);if(l&&confirm(`Delete the lesson for ${studentById(l.studentId).name} on ${dayMonth(l.date)}?`)){if(l.ruleId)saveOccurrence({...l,deleted:true});else db.lessons=db.lessons.filter(x=>x.id!==l.id);closeModal();persist();toast('Lesson deleted');}return;}
    let v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();return;}
    let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}
    if(e.target.id==='modal-overlay')closeModal();
  });
  document.addEventListener('change',e=>{if(e.target.id==='student-filter'){studentFilter=e.target.value;render();}if(e.target.id==='lesson-sort'){sortMode=e.target.value;render();}});
  document.addEventListener('input',e=>{if(e.target.id==='lesson-search'){let pos=e.target.selectionStart;search=e.target.value;render();let el=$('#lesson-search');el.focus();el.setSelectionRange(pos,pos);}});
  document.addEventListener('submit',e=>{if(e.target.id==='rate-form'){e.preventDefault();let r=Number($('#hourly-rate').value);if(r<=0||r>10000||!Number.isFinite(r))return;db.hourlyRate=r;persist();toast('Hourly rate updated');}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalKind)closeModal();});
  $('#import-file').addEventListener('change',importData);

  const client=window.supabase?.createClient('https://loksrhvzpsyfviuqbqob.supabase.co','sb_publishable_nMhif0pEJ0GU2jqlg-xcpw_IeCgzP0R');
  let account=null, revision=0, pending=null, saving=false, blocked=false;
  function status(t){const el=$('#cloud-status');if(el)el.textContent=t;const foot=$('#mobile-sync');if(foot)foot.textContent=t;}
  function gate(message='Sign in to access your lessons.'){
    $('.app').style.display='none';closeModal();
    let g=document.getElementById('login-gate');if(!g){g=document.createElement('div');g.id='login-gate';document.body.append(g);}
    g.innerHTML=`<div class="card" style="max-width:420px;margin:12vh auto;padding:30px"><h1>Lesson Studio</h1><p id="login-message">${esc(message)}</p><form id="login-form"><div class="field"><label>Email</label><input id="login-email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="login-password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="margin-top:18px" type="submit">Sign in</button></form></div>`;
    $('#login-form').onsubmit=async e=>{e.preventDefault();try{const {data,error}=await client.auth.signInWithPassword({email:$('#login-email').value,password:$('#login-password').value});if(error)throw error;await loadAccount(data.user);}catch(err){$('#login-message').textContent=err.message;}};
  }
  async function loadAccount(user){
    account=user;blocked=false;pending=null;
    let {data,error}=await client.from('lesson_studio_state').select('state,revision').eq('user_id',user.id).maybeSingle();if(error)throw error;
    if(!data){const result=await client.from('lesson_studio_state').insert({user_id:user.id,state:db,revision:0}).select('state,revision').single();if(result.error)throw result.error;data=result.data;}
    db=data.state;revision=data.revision;migrateData();
    $('#login-gate')?.remove();$('.app').style.display='';render();status('Cloud synced');
    if(!db.students.length&&!db.lessons.length){openSettings();toast('Import your existing JSON backup to get started');}
  }
  function queueSave(){pending=JSON.parse(JSON.stringify(db));if(blocked){status('Not synced — export backup');return;}flush();}
  async function flush(){if(saving||!account||blocked)return;saving=true;status('Saving…');try{while(pending){let snapshot=pending;pending=null;const {data,error}=await client.from('lesson_studio_state').update({state:snapshot,revision:revision+1}).eq('user_id',account.id).eq('revision',revision).select('revision').maybeSingle();if(error||!data){pending=pending||snapshot;throw error||new Error('Another device has saved a newer version.');}revision=data.revision;}status('Cloud synced');}catch(err){blocked=true;status('Not synced — export backup');alert('Cloud save failed: '+err.message+' Your edits are still on this page. Export a JSON backup before reloading.');}finally{saving=false;}}
  async function refreshCloud(){if(!account||saving||pending||blocked||modalKind||document.hidden)return;try{const {data,error}=await client.from('lesson_studio_state').select('state,revision').eq('user_id',account.id).single();if(!error&&data&&data.revision>revision&&!saving&&!pending&&!modalKind){db=data.state;revision=data.revision;render();status('Cloud synced');}}catch(err){console.warn(err);}}
  async function signOut(){if(saving||pending||blocked){alert('Unsynced changes. Export a backup before leaving.');return;}await client.auth.signOut();location.reload();}
  window.addEventListener('beforeunload',e=>{if(saving||pending||blocked){e.preventDefault();e.returnValue='';}});
  setInterval(refreshCloud,10000);window.addEventListener('focus',refreshCloud);
  (async()=>{gate();try{if(!client)throw Error('Could not load Supabase. Check your internet connection.');const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await loadAccount(data.session.user);}catch(err){gate(err.message);}})();

})();
</script>
